services:
  build:
    build:
      target: build
    image: chess-pgns:build
    command:
      - sh
      - -c
      - "go build -o bin/build_markdown src/builders/markdown_builder/build_markdown.go && go build -o bin/fen_builder src/builders/fen_builder/fen_to_diagram.go"
    volumes:
      - ./bin:/app/bin
      - ./go.mod:/app/go.mod
      - ./go.sum:/app/go.sum
    working_dir: /app

  dev:
    build:
      target: build
    image: chess-pgns:dev
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
    working_dir: /app
